<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="ATTIMI monogram">
  <title>ATTIMI  A</title>
  <!-- Enclosing ring -->
  <circle cx="40" cy="40" r="34" fill="none" stroke="#C7B299" stroke-width="1"/>
  <!-- Left leg of A -->
  <line x1="40" y1="11" x2="14" y2="67" stroke="#C7B299" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right leg of A -->
  <line x1="40" y1="11" x2="66" y2="67" stroke="#C7B299" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Split crossbar  gap represents "il momento" -->
  <line x1="22" y1="49" x2="34" y2="49" stroke="#C7B299" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="46" y1="49" x2="58" y2="49" stroke="#C7B299" stroke-width="1.8" stroke-linecap="round"/>
</svg>
