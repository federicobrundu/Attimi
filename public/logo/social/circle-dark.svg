<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="ATTIMI  circle dark">
  <title>ATTIMI</title>

  <!-- Dark circle background -->
  <circle cx="200" cy="200" r="200" fill="#1A1A1A"/>

  <!-- Monogram (80�80 � 200�200, scale=2.5) centered at (200,200) -->
  <!-- Center of 80�80 monogram = (40,40); scale(2.5) � center becomes (100,100) -->
  <!-- translate to (200-100, 200-100) = (100,100) -->
  <g transform="translate(100,100) scale(2.5)">
    <circle cx="40" cy="40" r="34" fill="none" stroke="#C7B299" stroke-width="0.4"/>
    <line x1="40" y1="11" x2="14" y2="67" stroke="#C7B299" stroke-width="0.72" stroke-linecap="round"/>
    <line x1="40" y1="11" x2="66" y2="67" stroke="#C7B299" stroke-width="0.72" stroke-linecap="round"/>
    <line x1="22" y1="49" x2="34" y2="49" stroke="#C7B299" stroke-width="0.72" stroke-linecap="round"/>
    <line x1="46" y1="49" x2="58" y2="49" stroke="#C7B299" stroke-width="0.72" stroke-linecap="round"/>
  </g>
</svg>
