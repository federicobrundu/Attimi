<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="ATTIMI Wedding Experience vertical">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400&amp;family=Inter:wght@300&amp;display=swap');
    </style>
  </defs>
  <title>ATTIMI Wedding Experience</title>

  <rect width="220" height="220" fill="#1A1A1A"/>

  <!-- Symbol centered  60�60 � 80�80 (scale 1.333), x=(220-80)/2=70, y=28 -->
  <g transform="translate(70,28) scale(1.333)">
    <path d="M 22,18 Q 30,10 38,18" fill="none" stroke="#C7B299" stroke-width="1.125" stroke-linecap="round"/>
    <path d="M 13,30 Q 30,16 47,30" fill="none" stroke="#C7B299" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 22,42 Q 30,34 38,42" fill="none" stroke="#C7B299" stroke-width="1.125" stroke-linecap="round"/>
  </g>

  <!-- Thin horizontal rule -->
  <line x1="96" y1="134" x2="124" y2="134" stroke="#C7B299" stroke-width="0.5" stroke-opacity="0.5"/>

  <!-- ATTIMI  centered text-anchor=middle -->
  <text x="110" y="160"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-weight="300"
    font-size="28"
    fill="#F8E9D8"
    letter-spacing="10"
    text-anchor="middle">ATTIMI</text>

  <!-- Tagline -->
  <text x="110" y="179"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="300"
    font-size="7"
    fill="#C7B299"
    letter-spacing="4.5"
    text-anchor="middle">WEDDING EXPERIENCE</text>
</svg>
